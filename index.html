<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Materiales para Drywall</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculadora de Drywall</h1>
        <p>Calcula los materiales necesarios para paredes y cielo raso</p>
    </header>

    <main class="container">
        <!-- Formulario de Entrada -->
        <section class="card">
            <h2>Parámetros del Proyecto</h2>
            
            <div class="form-group">
                <label for="tipoProyecto">Tipo de Estructura:</label>
                <select id="tipoProyecto">
                    <option value="pared">Pared / Tabique (Doble Cara)</option>
                    <option value="cielo">Cielo Raso / Cielorraso</option>
                </select>
            </div>

            <div class="form-group">
                <label for="largo">Largo del área (metros):</label>
                <input type="number" id="largo" step="0.01" placeholder="Ej. 5">
            </div>

            <div class="form-group">
                <label for="alto">Altura o Ancho del área (metros):</label>
                <input type="number" id="alto" step="0.01" placeholder="Ej. 2.6">
            </div>

            <button id="btnCalcular">Calcular Materiales</button>
        </section>

        <!-- Resultados -->
        <section class="card results-card" id="resultados">
            <h2>Lista de Materiales Estimados</h2>
            <div id="listaResultados">
                <p class="placeholder-text">Ingresa las medidas y haz clic en calcular para ver los resultados.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
