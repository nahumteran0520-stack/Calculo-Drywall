<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Materiales - Drywall</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- Selector Inicial de Categoría -->
        <div id="seccion-menu" class="card">
            <h1>Calculadora de Materiales Drywall</h1>
            <p>Selecciona el tipo de proyecto que deseas calcular:</p>
            <div class="menu-buttons">
                <button class="btn-opcion" onclick="seleccionarModulo('pared')">Paredes con Drywall</button>
                <button class="btn-opcion" onclick="seleccionarModulo('cielo')">Cielo Raso Drywall</button>
            </div>
        </div>

        <!-- Formulario de Cálculo (Oculto al inicio) -->
        <div id="seccion-calculo" class="card hidden">
            <button class="btn-volver" onclick="volverMenu()">⬅ Volver al menú</button>
            <h2 id="titulo-modulo">Calculadora</h2>

            <div class="form-group">
                <label for="alto">Alto</label>
                <input type="number" id="alto" step="0.01" placeholder="Ej. 2" oninput="calcularArea()">
            </div>

            <div class="form-group">
                <label for="largo">Largo</label>
                <input type="number" id="largo" step="0.01" placeholder="Ej. 2" oninput="calcularArea()">
            </div>

            <div class="form-group">
                <label for="area">Area a Cubrir</label>
                <input type="number" id="area" readonly placeholder="0">
            </div>

            <button class="btn-calcular" onclick="generarResultados()">CALCULAR</button>
        </div>

        <!-- Tabla de Resultados (Oculto al inicio) -->
        <div id="seccion-resultados" class="card hidden">
            <h2>Resultados de Materiales</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Artículo</th>
                            <th>Codigo</th>
                            <th>Descripcion</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                        <!-- Los resultados se cargan aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
            <button class="btn-calcular" style="margin-top: 20px;" onclick="nuevoCalculo()">Hacer otro cálculo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
