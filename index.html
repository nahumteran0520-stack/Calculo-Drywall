<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Combinación de Materiales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Simulador de Combinaciones</h1>
        <p>Selecciona los materiales para visualizar tu espacio</p>
    </header>

    <main class="app-container">
        <!-- Bloque de Controles / Selección -->
        <section class="control-panel">
            <div class="panel-block">
                <h2>1. Piso (Porcelanato / Cerámica)</h2>
                <div class="options-grid" id="floor-options">
                    <button class="option-btn active" data-type="floor" data-value="#e0e0e0" data-name="Gris Claro">Gris Claro</button>
                    <button class="option-btn" data-type="floor" data-value="#8d6e63" data-name="Madera rústica">Madera Rústica</button>
                    <button class="option-btn" data-type="floor" data-value="#212121" data-name="Grafito Oscuro">Grafito Oscuro</button>
                </div>
            </div>

            <div class="panel-block">
                <h2>2. Pared (Panel SPC / Revestimiento)</h2>
                <div class="options-grid" id="wall-options">
                    <button class="option-btn active" data-type="wall" data-value="#ffffff" data-name="Blanco Mate">Blanco Mate</button>
                    <button class="option-btn" data-type="wall" data-value="#d7ccc8" data-name="Beige Piedra">Beige Piedra</button>
                    <button class="option-btn" data-type="wall" data-value="#37474f" data-name="Panel Acanalado Oscuro">Panel Oscuro</button>
                </div>
            </div>

            <div class="panel-block">
                <h2>3. Detalle / Acento</h2>
                <div class="options-grid" id="accent-options">
                    <button class="option-btn active" data-type="accent" data-value="#ffb300" data-name="Detalle Dorado">Dorado</button>
                    <button class="option-btn" data-type="accent" data-value="#78909c" data-name="Perfil Metálico Acero">Acero</button>
                    <button class="option-btn" data-type="accent" data-value="#4e342e" data-name="Madera Nogal">Nogal</button>
                </div>
            </div>
        </section>

        <!-- Bloque de Visualización -->
        <section class="preview-panel">
            <h2>Vista Previa de la Combinación</h2>
            <div class="simulation-stage" id="stage">
                <div class="wall-layer" id="wall-layer" style="background-color: #ffffff;">
                    <div class="accent-layer" id="accent-layer" style="background-color: #ffb300;"></div>
                </div>
                <div class="floor-layer" id="floor-layer" style="background-color: #e0e0e0;"></div>
            </div>
            <div class="selection-summary" id="summary">
                <p><strong>Piso:</strong> Gris Claro | <strong>Pared:</strong> Blanco Mate | <strong>Acento:</strong> Dorado</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
